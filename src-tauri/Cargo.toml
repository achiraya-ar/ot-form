[package]
name = "ot-form"
version = "0.1.0"
description = "OT-Form — บันทึกค่าตอบแทนนอกเวลาราชการ"
authors = ["OT-Form"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ot_form_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
